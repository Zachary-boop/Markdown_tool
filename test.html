<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static HTML/CSS File Tree</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="file-tree">
        <ul>
            <li>
                <span class="folder">my-project</span>
                <ul>
                    <li>
                        <span class="folder">src</span>
                        <ul>
                            <li>
                                <span class="folder">assets</span>
                                <ul>
                                    <li><span class="file">logo.png</span></li>
                                    <li><span class="file">styles.css</span></li>
                                </ul>
                            </li>
                            <li><span class="file">App.js</span></li>
                            <li><span class="file">index.js</span></li>
                        </ul>
                    </li>
                    <li>
                        <span class="folder">public</span>
                        <ul>
                            <li><span class="file">index.html</span></li>
                            <li><span class="file">favicon.ico</span></li>
                        </ul>
                    </li>
                    <li><span class="file">package.json</span></li>
                    <li><span class="file">README.md</span></li>
                </ul>
            </li>
        </ul>
    </div>

</body>
</html>
